name: Checks and evaluation readiness
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    needs: backend-tests
    if: ${{ always() }}
    steps:
      - name: Require backend matrix success
        run: test '${{ needs.backend-tests.result }}' = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt -r backend/requirements-video-test.txt
      - run: python -m nltk.downloader wordnet
      - run: python -m ruff check . && python -m ruff format --check .
      - run: python backend/tools/validate_signs.py
      - run: python backend/tools/repo_stats.py --check-readme README.md
      - name: Measure English vocabulary gaps (informational)
        env:
          LLM_PROVIDER: mock
          ENABLE_SYNONYM_FALLBACK: 'false'
        shell: bash
        run: |
          python backend/tools/coverage_report.py eval/domain_sentences.txt --json-output "$RUNNER_TEMP/coverage-report.json" --markdown-output "$RUNNER_TEMP/coverage-report.md"
          cat "$RUNNER_TEMP/coverage-report.md" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
        working-directory: frontend
      - run: npm test && npx tsc --noEmit && npm run build
        working-directory: frontend
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt -r backend/requirements-video-test.txt
      - run: python -m nltk.downloader wordnet
      - name: Backend tests and coverage
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --cov=. --cov-config=../pyproject.toml --cov-report=term-missing | tee coverage.txt
      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          echo '### Backend coverage (Python ${{ matrix.python }})' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat backend/coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
  evaluation-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m nltk.downloader wordnet
      - shell: bash
        run: |
          status=0
          python eval/run_eval.py --check || status=$?
          if [ "$status" -eq 2 ]; then
            echo 'NO_VERIFIED_ROWS: evaluation needs signer-reviewed rows. No scores were produced; this is informational, not a successful linguistic evaluation.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"
  docker-build:
    # Coverage ablations have a separate informational job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t signai-backend ./backend
      - run: docker build -t signai-frontend ./frontend
      - name: Backend health smoke test
        shell: bash
        run: |
          docker run -d --name signai-backend -p 8000:8000 -e LLM_PROVIDER=mock signai-backend
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs signai-backend
          exit 1
      - if: always()
        run: docker rm -f signai-backend || true
  coverage-ablation-informational:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - run: pip install -r backend/requirements.txt
      - run: python -m nltk.downloader wordnet
      - name: Offline coverage ablation — no live-model inference
        env:
          PYTHONHASHSEED: '20261103'
          LLM_PROVIDER: mock
        run: python eval/ablation.py --output eval/reports/ablation.json
      - name: Informational summary
        if: always()
        shell: bash
        run: |
          if [ -f eval/reports/ablation.md ]; then cat eval/reports/ablation.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-coverage-ablation-not-isl-accuracy
          path: eval/reports/ablation.*
