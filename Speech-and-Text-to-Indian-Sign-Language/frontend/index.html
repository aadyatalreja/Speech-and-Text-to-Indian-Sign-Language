<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#FAF8F5" />
<title>SignAI — Text to Indian Sign Language</title>
<!-- Apply the saved/system theme before first paint to avoid a light flash. -->
<script>(function(){try{var s=localStorage.getItem("signai.theme");var d=s?s==="dark":matchMedia("(prefers-color-scheme: dark)").matches;var r=document.documentElement;if(d)r.classList.add("dark");r.style.colorScheme=d?"dark":"light";}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
