services:
  backend:
    build: ./backend
    env_file: [.env]
    expose: ["8000"]
    volumes:
      - ./backend/data/signs:/app/data/signs:ro
      - generated-videos:/app/generated
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  generated-videos:
